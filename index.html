<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão SPAECE - 9º Ano</title>
    <style>
        /* ================= VARIÁVEIS DE CORES E FONTES ================= */
        :root {
            --azul-royal: #1e3a8a;
            --azul-claro: #3b82f6;
            --laranja: #f59e0b;
            --verde-sucesso: #10b981;
            --vermelho-caneta: #991b1b; /* Cor para o cálculo simulando caneta */
            --fundo: #f8fafc;
            --fundo-calc: #f1f5f9;
            --texto: #1e293b;
            --borda: #cbd5e1;
        }

        /* Fonte Base Gigante para evitar Zoom */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background-color: var(--fundo); color: var(--texto); overflow: hidden; font-size: 16pt; }

        /* ================= CABEÇALHO E NAVEGAÇÃO ================= */
        .header { background-color: var(--azul-royal); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.15); z-index: 10; }
        .header-info h1 { font-size: 18pt; text-transform: uppercase; margin-bottom: 5px; }
        .header-info p { font-size: 12pt; color: #bfdbfe; }
        
        .nav-questoes { display: flex; gap: 10px; }
        .btn-nav-q { background: transparent; border: 2px solid white; color: white; padding: 10px 20px; border-radius: 8px; font-size: 14pt; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-nav-q:hover, .btn-nav-q.ativo { background-color: var(--laranja); border-color: var(--laranja); }

        .nav-niveis { background-color: #e2e8f0; padding: 10px 30px; display: flex; gap: 15px; justify-content: center; box-shadow: inset 0 -2px 5px rgba(0,0,0,0.05); }
        .btn-nav-nivel { background: white; border: 2px solid var(--borda); color: var(--azul-royal); padding: 8px 25px; border-radius: 20px; font-size: 14pt; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-nav-nivel:hover { border-color: var(--azul-claro); }
        .btn-nav-nivel.ativo { background-color: var(--azul-claro); color: white; border-color: var(--azul-claro); }

        /* ================= ÁREA DO SLIDE ================= */
        .content-area { flex-grow: 1; display: flex; justify-content: center; align-items: flex-start; padding: 30px; overflow-y: auto; }
        
        .slide { width: 100%; max-width: 1300px; background: white; border-radius: 12px; padding: 40px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); display: none; flex-direction: column; animation: fadeIn 0.3s ease; }
        .slide.ativa { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .contexto-caixa { background-color: #eff6ff; border-left: 6px solid var(--azul-claro); padding: 20px; border-radius: 0 8px 8px 0; margin-bottom: 25px; font-size: 18pt; line-height: 1.4; color: #1e3a8a; }
        
        .alternativa-texto { font-size: 22pt; font-weight: bold; color: var(--texto); margin-bottom: 30px; line-height: 1.3; }

        /* ================= BOTÃO E RESOLUÇÃO EM CASCATA ================= */
        .btn-revelar { background-color: var(--laranja); color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 16pt; font-weight: bold; cursor: pointer; align-self: center; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-revelar:hover { background-color: #d97706; transform: scale(1.05); }

        .resolucao-container { display: none; margin-top: 30px; flex-direction: column; align-items: center; width: 100%; }
        .resolucao-container.visivel { display: flex; animation: slideDown 0.4s ease; }
        
        /* O Bloco estilo "Linha de Caderno" */
        .calculo-cascata { background-color: var(--fundo-calc); width: 100%; max-width: 800px; padding: 30px; border-radius: 12px; border: 2px dashed #94a3b8; text-align: center; font-size: 24pt; font-weight: bold; color: var(--vermelho-caneta); line-height: 1.8; margin-bottom: 20px; font-family: 'Courier New', Courier, monospace; letter-spacing: 1px; }
        .calculo-cascata div { border-bottom: 1px solid #cbd5e1; padding-bottom: 5px; margin-bottom: 10px; }
        .calculo-cascata div:last-child { border-bottom: none; margin-bottom: 0; font-size: 28pt; color: var(--verde-sucesso); } /* Resposta Final Maior e Verde */

        .motivo-pedagogico { font-size: 16pt; font-style: italic; color: #475569; text-align: center; max-width: 900px; background: #f8fafc; padding: 15px; border-radius: 8px; }

        /* ================= GRID CARTESIANO (QUESTÃO 5) ================= */
        .layout-cartesiano { display: flex; width: 100%; gap: 40px; align-items: flex-start; }
        .layout-texto { flex: 1; display: flex; flex-direction: column; align-items: center; }
        .svg-container { flex: 1; max-width: 500px; aspect-ratio: 1/1; background: white; border: 2px solid var(--borda); border-radius: 8px; padding: 15px; box-shadow: inset 0 0 10px rgba(0,0,0,0.05); }

        /* ================= RODAPÉ DE NAVEGAÇÃO ================= */
        .footer { background: white; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--borda); }
        .instrucoes { font-size: 13pt; color: #64748b; }
        .nav-botoes-rodape button { background-color: var(--azul-royal); color: white; border: none; padding: 12px 25px; border-radius: 8px; font-size: 14pt; font-weight: bold; cursor: pointer; transition: 0.3s; margin-left: 10px; }
        .nav-botoes-rodape button:hover { background-color: var(--azul-claro); }
        .nav-botoes-rodape button:disabled { background-color: var(--borda); cursor: not-allowed; }

        /* ================= CLASSES DE INTERATIVIDADE (TECLADO) ================= */
        .hl-sub { text-decoration: underline; text-decoration-thickness: 4px; text-underline-offset: 6px; border-bottom: 3px solid var(--laranja); }
        .hl-dest { background-color: #fef08a; color: #000; border-radius: 4px; padding: 0 5px; font-weight: bold; box-shadow: 0 0 5px rgba(254, 240, 138, 0.8); } 
        .hl-ocult { color: transparent; background-color: #cbd5e1; border-radius: 6px; }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <header class="header">
        <div class="header-info">
            <h1>EMEBTI Itelvina Silvina de Pinho</h1>
            <p>Prof. Ricardo Júnior | Revisão - Prova 3º Bimestre 9º Ano B</p>
        </div>
        <div class="nav-questoes">
            <button class="btn-nav-q" onclick="irParaQuestao(1)">Q1 (Porcentagem)</button>
            <button class="btn-nav-q" onclick="irParaQuestao(2)">Q2 (Juros)</button>
            <button class="btn-nav-q" onclick="irParaQuestao(3)">Q3 (Sistemas)</button>
            <button class="btn-nav-q" onclick="irParaQuestao(4)">Q4 (Eq. 2º Grau)</button>
            <button class="btn-nav-q" onclick="irParaQuestao(5)">Q5 (Cartesiano)</button>
        </div>
    </header>
    
    <!-- SUB-NAVEGAÇÃO DE NÍVEIS -->
    <div class="nav-niveis">
        <button class="btn-nav-nivel" id="btn-nivel-0" onclick="irParaNivel(0)">Nível 1 (Adequada) - A</button>
        <button class="btn-nav-nivel" id="btn-nivel-1" onclick="irParaNivel(1)">Nível 2 (Padrão) - B</button>
        <button class="btn-nav-nivel" id="btn-nivel-2" onclick="irParaNivel(2)">Nível 3 (Avançada) - C</button>
    </div>

    <!-- ÁREA PRINCIPAL ONDE AS LÂMINAS SERÃO RENDERIZADAS PELO JS -->
    <main class="content-area" id="main-content">
        <!-- O conteúdo será injetado aqui -->
    </main>

    <!-- RODAPÉ E INSTRUÇÕES -->
    <footer class="footer">
        <div class="instrucoes">
            <strong>Teclas Interativas:</strong> Selecione o texto e aperte <b>[S]</b> Sublinhar | <b>[D]</b> Destacar | <b>[O]</b> Ocultar | <b>[L]</b> Limpar
        </div>
        <div class="nav-botoes-rodape">
            <button id="btn-prev" onclick="navegar(-1)">◀ Anterior</button>
            <button id="btn-next" onclick="navegar(1)">Próxima ▶</button>
        </div>
    </footer>

    <script>
        // ================= BANCO DE DADOS (LINHA DE CADERNO) =================
        const bancoRevisao = [
            // QUESTÃO 1 - PORCENTAGEM
            {
                titulo: "QUESTÃO 01 - Porcentagem",
                contexto: "Uma loja de eletrônicos está fazendo uma grande liquidação. Um videogame de última geração tem o preço de tabela fixado em 500 reais. Com base nesse cenário, calcule:",
                alternativas: [
                    {
                        letra: "A) (Nível 1)", 
                        texto: "O gerente anunciou um desconto de 20% sobre o preço de tabela do videogame. Qual será o preço final pago pelo cliente?",
                        cascata: ["10% de R$ 500 = R$ 50", "20% = R$ 50 x 2 = R$ 100", "500 - 100 = 400", "Preço Final = R$ 400,00"],
                        motivo: "Execução direta do cálculo percentual (desconto simples), validando a habilidade básica."
                    },
                    {
                        letra: "B) (Nível 2)", 
                        texto: "Se o cliente comprar o videogame com o desconto de 20% e a máquina de cartão cobrar um acréscimo de 10% sobre o valor já com desconto, qual será o valor definitivo da compra?",
                        cascata: ["Preço com desconto = R$ 400", "Acréscimo: 10% de 400 = R$ 40", "400 + 40 = 440", "Valor Definitivo = R$ 440,00"],
                        motivo: "Evita a ilusão de que as taxas (-20% e +10%) se anulam, exigindo cálculo sucessivo sobre nova base."
                    },
                    {
                        letra: "C) (Nível 3)", 
                        texto: "Um outro cliente comprou um celular na mesma loja. Ele recebeu 30% de desconto e pagou exatamente 280 reais pelo aparelho. Qual era o preço original do celular?",
                        cascata: ["100% - 30% = 70% pago", "70% ➔ R$ 280", "10% ➔ 280 ÷ 7 = R$ 40", "100% ➔ 40 x 10", "Preço Original = R$ 400,00"],
                        motivo: "Raciocínio reverso lógico que dispensa a aplicação mecânica da regra de três, valorizando proporção."
                    }
                ]
            },
            // QUESTÃO 2 - JUROS SIMPLES
            {
                titulo: "QUESTÃO 02 - Juros Simples",
                contexto: "Júlia precisa de um empréstimo para consertar sua moto e está pesquisando opções em diferentes lugares.",
                alternativas: [
                    {
                        letra: "A) (Nível 1)", 
                        texto: "Ela pegou 200 reais a uma taxa de 5% ao mês durante 3 meses. Qual foi o valor pago apenas de juros?",
                        cascata: ["1 Mês: 5% de 200 = R$ 10", "3 Meses: 10 x 3 = 30", "Total de Juros = R$ 30,00"],
                        motivo: "Cálculo linear e direto, avaliando a compreensão base da taxa aplicada ao tempo."
                    },
                    {
                        letra: "B) (Nível 2)", 
                        texto: "Se ela pegar 400 reais a 2% ao mês por 4 meses, qual será o valor total a devolver no final (Capital Inicial + Juros)?",
                        cascata: ["1 Mês: 2% de 400 = R$ 8", "4 Meses: 8 x 4 = R$ 32", "Montante: 400 + 32", "Total a Devolver = R$ 432,00"],
                        motivo: "Exige atenção ao comando do Montante, evitando que o aluno pare a conta no meio após achar o juro."
                    },
                    {
                        letra: "C) (Nível 3)", 
                        texto: "Em outro banco, ela pagou 60 reais de juros num empréstimo que durou 5 meses, com taxa de 4% ao mês. Qual foi o valor inicial emprestado?",
                        cascata: ["5 Meses = R$ 60 de Juros", "1 Mês = 60 ÷ 5 = R$ 12", "Taxa: 4% ➔ R$ 12", "1% ➔ 12 ÷ 4 = R$ 3", "100% ➔ 3 x 100", "Valor Inicial = R$ 300,00"],
                        motivo: "Manipulação algébrica reversa, exigindo dedução do capital a partir do rendimento mensal."
                    }
                ]
            },
            // QUESTÃO 3 - SISTEMAS
            {
                titulo: "QUESTÃO 03 - Sistemas do 1º Grau",
                contexto: "Os alunos estão organizando lanches e ingressos para um evento da escola. Baseado nos preços, resolva:",
                alternativas: [
                    {
                        letra: "A) (Nível 1)", 
                        texto: "Ana comprou 2 salgados e 1 suco por 10 reais. Marcos comprou 1 salgado e 2 sucos por 11 reais. Escreva o sistema matemático chamando o salgado de 'x' e o suco de 'y'.",
                        cascata: ["Ana: 2 Salgados(x) + 1 Suco(y) = 10", "Marcos: 1 Salgado(x) + 2 Sucos(y) = 11", "Sistema: { 2x + y = 10 ; x + 2y = 11 }"],
                        motivo: "Modelagem algébrica pura, extraindo os dados corretamente do texto para linguagem matemática."
                    },
                    {
                        letra: "B) (Nível 2)", 
                        texto: "João comprou 2 pães e 1 café por 12 reais. Maria comprou 1 pão e 1 café por 7 reais. Qual é o preço exato de apenas um pão?",
                        cascata: ["João: 2 Pães + 1 Café = 12", "Maria: 1 Pão + 1 Café = 7", "Diferença: 1 Pão a mais custou 12 - 7", "1 Pão = R$ 5,00"],
                        motivo: "Dedução por subtração lógica, estimulando o cálculo mental sem precisar isolar 'x' e 'y' formalmente."
                    },
                    {
                        letra: "C) (Nível 3)", 
                        texto: "O 'Combo A' (2 ingressos + 1 pipoca) custa 40 reais. O 'Combo B' (1 ingresso + 1 pipoca) custa 25 reais. Qual será o valor pago por 1 ingresso e 2 pipocas juntos?",
                        cascata: ["Dif (A - B): 1 Ingresso extra = 40 - 25 = 15", "Combo B: Ing(15) + Pip = 25 ➔ Pipoca = 10", "Novo Pedido: 1 Ing(15) + 2 Pip(20)", "Total = R$ 35,00"],
                        motivo: "Exige descobrir ambas as variáveis e combiná-las obrigatoriamente em um cenário totalmente novo."
                    }
                ]
            },
            // QUESTÃO 4 - EQUAÇÃO DO 2º GRAU
            {
                titulo: "QUESTÃO 04 - Equações do 2º Grau",
                contexto: "Utilize a lógica das equações quadráticas para resolver os seguintes enigmas e problemas de área:",
                alternativas: [
                    {
                        letra: "A) (Nível 1)", 
                        texto: "A senha de um cofre digital é a maior raiz da equação x&sup2; - 5x + 6 = 0. Qual é a senha do cofre?",
                        cascata: ["Equação: x&sup2; - 5x + 6 = 0", "Soma das raízes = 5", "Produto das raízes = 6", "Raízes que satisfazem: 2 e 3", "Maior Raiz (Senha) = 3"],
                        motivo: "Teste direto das habilidades de Soma e Produto (ou Bhaskara) em uma base inteira e amigável."
                    },
                    {
                        letra: "B) (Nível 2)", 
                        texto: "Um mural retangular possui área igual a 24m&sup2;. O seu comprimento mede 2 metros a mais que a sua altura. Sabendo que a equação é x(x+2) = 24, qual é a altura?",
                        cascata: ["Distribuição: x&sup2; + 2x = 24", "Igualar a zero: x&sup2; + 2x - 24 = 0", "Soma = -2 | Produto = -24", "Raízes: -6 e 4 (Área não pode ser negativa)", "Altura = 4 metros"],
                        motivo: "Interpretação geométrica gerando a equação e descarte lógico da raiz negativa."
                    },
                    {
                        letra: "C) (Nível 3)", 
                        texto: "O quadrado de um número secreto, menos três vezes esse mesmo número, resulta em 10. Monte a equação igualada a zero e descubra qual é esse número positivo.",
                        cascata: ["Montagem: x&sup2; - 3x = 10", "Igualar a zero: x&sup2; - 3x - 10 = 0", "Soma = 3 | Produto = -10", "Raízes: 5 e -2", "Número Positivo = 5"],
                        motivo: "Tradução textual completa da álgebra (modelagem avançada do zero) antes da resolução matemática."
                    }
                ]
            },
            // QUESTÃO 5 - PLANO CARTESIANO
            {
                titulo: "QUESTÃO 05 - Plano Cartesiano",
                contexto: "Analise as coordenadas e movimentos dentro da malha quadriculada para responder aos desafios:",
                alternativas: [
                    {
                        letra: "A) (Nível 1)", 
                        texto: "O Ponto P está localizado a 3 casas para a direita e 4 casas para cima a partir do zero (Origem). Escreva o par ordenado desse ponto.",
                        cascata: ["Direita ➔ Eixo Horizontal (X) = 3", "Cima ➔ Eixo Vertical (Y) = 4", "Formato Padrão: (X, Y)", "Par Ordenado = (3, 4)"],
                        motivo: "Domínio puro de localização nos eixos sem erros de inversão (X antes de Y)."
                    },
                    {
                        letra: "B) (Nível 2)", 
                        texto: "Um robô sai de A(1, 1), move-se na horizontal para B(5, 1) e sobe para C(5, 4). Quantas unidades ele andou no total?",
                        cascata: ["De X=1 até X=5 ➔ Andou 4 passos", "De Y=1 até Y=4 ➔ Andou 3 passos", "Soma dos Movimentos: 4 + 3", "Andou 7 Unidades"],
                        motivo: "Introdução à noção de distância pela contagem de vetores visuais em movimento L."
                    },
                    {
                        letra: "C) (Nível 3)", 
                        texto: "Para formar um retângulo perfeito na malha, marcamos os cantos A(2, 2), B(7, 2) e C(7, 6). Qual deve ser o par ordenado do quarto canto D?",
                        cascata: ["Alinhamento Vertical com A ➔ X = 2", "Alinhamento Horizontal com C ➔ Y = 6", "Cruzamento das Linhas:", "Ponto D = (2, 6)"],
                        motivo: "Dedução espacial lógica para encontrar o vértice oculto."
                    }
                ]
            }
        ];

        // ================= LÓGICA DE NAVEGAÇÃO E RENDERIZAÇÃO =================
        let questaoAtual = 0; // 0 a 4
        let nivelAtual = 0;   // 0 a 2 (A, B, C)
        const contentArea = document.getElementById("main-content");

        function renderizarSlide() {
            const questao = bancoRevisao[questaoAtual];
            const alt = questao.alternativas[nivelAtual];
            const ehCartesiano = (questaoAtual === 4);

            // Montagem do Efeito Cascata (Linha de Caderno)
            let cascataHTML = alt.cascata.map(linha => `<div>${linha}</div>`).join('');

            // Estrutura do Layout (Com ou sem SVG na lateral)
            let html = `
                <div class="slide ativa">
                    <div class="contexto-caixa">
                        <strong>${questao.titulo}</strong><br>
                        ${questao.contexto}
                    </div>
                    
                    <div class="${ehCartesiano ? 'layout-cartesiano' : ''}">
                        <div class="${ehCartesiano ? 'layout-texto' : ''}" style="width: 100%;">
                            <div class="alternativa-texto">${alt.letra}: ${alt.texto}</div>
                            
                            <button class="btn-revelar" onclick="revelarResolucao(this, ${ehCartesiano}, '${['A','B','C'][nivelAtual]}')">
                                Revelar Cálculo e Motivo 🔽
                            </button>
                            
                            <div class="resolucao-container">
                                <div class="calculo-cascata">
                                    ${cascataHTML}
                                </div>
                                <div class="motivo-pedagogico">
                                    <strong>Foco Pedagógico:</strong> ${alt.motivo}
                                </div>
                            </div>
                        </div>

                        ${ehCartesiano ? `<div class="svg-container" id="malha-container"></div>` : ''}
                    </div>
                </div>
            `;
            
            contentArea.innerHTML = html;

            // Atualiza UI dos Botões
            document.querySelectorAll('.btn-nav-q').forEach((b, i) => b.classList.toggle('ativo', i === questaoAtual));
            document.querySelectorAll('.btn-nav-nivel').forEach((b, i) => b.classList.toggle('ativo', i === nivelAtual));

            // Desabilita botões de Prev/Next nos extremos
            document.getElementById("btn-prev").disabled = (questaoAtual === 0 && nivelAtual === 0);
            document.getElementById("btn-next").disabled = (questaoAtual === 4 && nivelAtual === 2);
        }

        function irParaQuestao(indice) {
            questaoAtual = indice - 1;
            nivelAtual = 0; // Sempre volta pra letra A ao trocar de questão
            renderizarSlide();
        }

        function irParaNivel(indice) {
            nivelAtual = indice;
            renderizarSlide();
        }

        function navegar(direcao) {
            nivelAtual += direcao;
            if (nivelAtual > 2) {
                if (questaoAtual < 4) { questaoAtual++; nivelAtual = 0; }
                else { nivelAtual = 2; }
            } else if (nivelAtual < 0) {
                if (questaoAtual > 0) { questaoAtual--; nivelAtual = 2; }
                else { nivelAtual = 0; }
            }
            renderizarSlide();
        }

        // ================= REVELAR CÁLCULO E CARTESIANO =================
        function revelarResolucao(btn, ehCartesiano, letra) {
            const container = btn.nextElementSibling;
            if (container.classList.contains("visivel")) {
                container.classList.remove("visivel");
                btn.innerHTML = "Revelar Cálculo e Motivo 🔽";
                if(ehCartesiano) limparGrid();
            } else {
                container.classList.add("visivel");
                btn.innerHTML = "Ocultar Resolução 🔼";
                if(ehCartesiano) {
                    iniciarGrid();
                    if (letra === 'A') desenharLetraA();
                    if (letra === 'B') desenharLetraB();
                    if (letra === 'C') desenharLetraC();
                }
            }
        }

        // ================= INTERATIVIDADE DE TECLADO (S, D, O, L) =================
        document.addEventListener('keydown', (e) => {
            const selecao = window.getSelection();
            if (selecao.rangeCount === 0 || selecao.isCollapsed) return;

            const tecla = e.key.toLowerCase();
            if (!['s', 'd', 'o', 'l'].includes(tecla)) return;

            const range = selecao.getRangeAt(0);

            if (tecla === 'l') {
                let pai = range.commonAncestorContainer;
                if (pai.nodeType === 3) pai = pai.parentNode;
                
                if (pai.classList && (pai.classList.contains('hl-sub') || pai.classList.contains('hl-dest') || pai.classList.contains('hl-ocult'))) {
                    const texto = document.createTextNode(pai.textContent);
                    pai.parentNode.replaceChild(texto, pai);
                }
                return;
            }

            const span = document.createElement('span');
            if (tecla === 's') span.className = 'hl-sub';      
            if (tecla === 'd') span.className = 'hl-dest';     
            if (tecla === 'o') span.className = 'hl-ocult';    

            try {
                range.surroundContents(span);
                selecao.removeAllRanges(); 
            } catch (err) {
                console.warn("Selecione o texto sem cruzar blocos.");
            }
        });

        // ================= GERAÇÃO DO PLANO CARTESIANO (SVG) =================
        const svgNS = "http://www.w3.org/2000/svg";
        function cx(val) { return val * 10; }
        function cy(val) { return 100 - (val * 10); }

        function iniciarGrid() {
            const cont = document.getElementById("malha-container");
            cont.innerHTML = ""; // Limpa antes de gerar
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("viewBox", "-15 -10 125 125"); 
            svg.style.width = "100%"; svg.style.height = "100%";

            const gGrid = document.createElementNS(svgNS, "g");
            for(let i=0; i<=10; i++) {
                let pos = i * 10;
                let v = document.createElementNS(svgNS, "line");
                v.setAttribute("x1", pos); v.setAttribute("y1", 0); v.setAttribute("x2", pos); v.setAttribute("y2", 100); v.setAttribute("stroke", "var(--borda)");
                gGrid.appendChild(v);
                let h = document.createElementNS(svgNS, "line");
                h.setAttribute("x1", 0); h.setAttribute("y1", pos); h.setAttribute("x2", 100); h.setAttribute("y2", pos); h.setAttribute("stroke", "var(--borda)");
                gGrid.appendChild(h);
            }
            svg.appendChild(gGrid);

            const eixos = document.createElementNS(svgNS, "path");
            eixos.setAttribute("d", "M 0 0 L 0 100 L 105 100"); eixos.setAttribute("stroke", "var(--texto)"); eixos.setAttribute("stroke-width", "1.5"); eixos.setAttribute("fill", "none");
            svg.appendChild(eixos);

            for(let i=1; i<=10; i++) {
                let pos = i * 10;
                let tx = document.createElementNS(svgNS, "text"); tx.setAttribute("x", pos); tx.setAttribute("y", 106); tx.setAttribute("font-size", "4.5"); tx.setAttribute("text-anchor", "middle"); tx.textContent = i; svg.appendChild(tx);
                let ty = document.createElementNS(svgNS, "text"); ty.setAttribute("x", -4); ty.setAttribute("y", 100 - pos + 1.5); ty.setAttribute("font-size", "4.5"); ty.setAttribute("text-anchor", "end"); ty.textContent = i; svg.appendChild(ty);
            }
            
            let t0 = document.createElementNS(svgNS, "text"); t0.setAttribute("x", -3); t0.setAttribute("y", 105); t0.setAttribute("font-size", "4.5"); t0.setAttribute("text-anchor", "end"); t0.textContent = "0"; svg.appendChild(t0);

            const gResp = document.createElementNS(svgNS, "g");
            gResp.setAttribute("id", "camada-respostas");
            svg.appendChild(gResp);
            cont.appendChild(svg);
        }

        function limparGrid() { const cont = document.getElementById("malha-container"); if(cont) cont.innerHTML = ""; }

        function desenharPonto(x, y, label, cor="var(--laranja)") {
            const g = document.getElementById("camada-respostas");
            const px = cx(x); const py = cy(y);
            const circ = document.createElementNS(svgNS, "circle");
            circ.setAttribute("cx", px); circ.setAttribute("cy", py); circ.setAttribute("r", "2.5"); circ.setAttribute("fill", cor);
            g.appendChild(circ);
            if(label) {
                const txt = document.createElementNS(svgNS, "text"); txt.setAttribute("x", px + 3); txt.setAttribute("y", py - 3); txt.setAttribute("font-size", "5"); txt.setAttribute("font-weight", "bold"); txt.setAttribute("fill", cor); txt.textContent = label;
                g.appendChild(txt);
            }
        }

        function desenharLinha(x1, y1, x2, y2, cor="var(--laranja)", pontilhado=false) {
            const g = document.getElementById("camada-respostas");
            const line = document.createElementNS(svgNS, "line");
            line.setAttribute("x1", cx(x1)); line.setAttribute("y1", cy(y1)); line.setAttribute("x2", cx(x2)); line.setAttribute("y2", cy(y2)); line.setAttribute("stroke", cor); line.setAttribute("stroke-width", "2");
            if(pontilhado) line.setAttribute("stroke-dasharray", "2,2");
            if(g.firstChild) g.insertBefore(line, g.firstChild); else g.appendChild(line);
        }

        function desenharLetraA() {
            desenharLinha(0, 4, 3, 4, "var(--verde-sucesso)", true); desenharLinha(3, 0, 3, 4, "var(--verde-sucesso)", true);
            desenharPonto(3, 4, "P(3,4)", "var(--verde-sucesso)");
        }
        function desenharLetraB() {
            desenharLinha(1, 1, 5, 1, "var(--laranja)"); desenharLinha(5, 1, 5, 4, "var(--laranja)");
            desenharPonto(1, 1, "A"); desenharPonto(5, 1, "B"); desenharPonto(5, 4, "C");
        }
        function desenharLetraC() {
            desenharLinha(2, 2, 7, 2, "gray"); desenharLinha(7, 2, 7, 6, "gray");
            desenharLinha(7, 6, 2, 6, "var(--verde-sucesso)", true); desenharLinha(2, 6, 2, 2, "var(--verde-sucesso)", true);
            desenharPonto(2, 2, "A", "gray"); desenharPonto(7, 2, "B", "gray"); desenharPonto(7, 6, "C", "gray");
            desenharPonto(2, 6, "D(2,6)", "var(--verde-sucesso)");
        }

        // Inicializa o primeiro slide
        window.onload = renderizarSlide;
    </script>
</body>
</html>
